name: Web Session correctness

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-session-correctness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  BENCH_DIR: crates/ironrdp-web/benches/dirty-region
  CHECKED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  session:
    name: Optimized WASM Session and deployment bindings
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the requested head commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "$CHECKED_HEAD"

      - name: Install WASM target and the repository's wasm-pack version
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Chromium
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium

      - name: Build actual optimized Session fixtures and normal deployment bindings
        run: |
          python "$BENCH_DIR/session-integration/build.py" \
            --expected-head "$CHECKED_HEAD" \
            --target-dir "$RUNNER_TEMP/web-session-target" \
            --output "$BENCH_DIR/output/session-correctness" \
            --deployment-smoke

      - name: Check actual Session behavior and normal bindings initialization in Chromium
        run: |
          python "$BENCH_DIR/session-integration/run.py" \
            --build-dir "$BENCH_DIR/output/session-correctness"

      - name: Preserve Session results, packages and build provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-session-correctness-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            crates/ironrdp-web/benches/dirty-region/output/session-correctness/report.json
            crates/ironrdp-web/benches/dirty-region/output/session-correctness/build-manifest.json
            crates/ironrdp-web/benches/dirty-region/output/session-correctness/build-*.log
            crates/ironrdp-web/benches/dirty-region/output/session-correctness/pkg/
          if-no-files-found: warn
          retention-days: 14
