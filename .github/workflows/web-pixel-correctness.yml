name: Web pixel correctness

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pixel-correctness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  BENCH_DIR: crates/ironrdp-web/benches/dirty-region
  CHECKED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  pixels:
    name: Current WASM pixels (SIMD and scalar)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the requested head commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "$CHECKED_HEAD"

      - name: Install WASM target and matching bindings tool
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Chromium
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium

      - name: Check current production pixels with and without SIMD
        run: |
          python "$BENCH_DIR/presentation/ci.py" \
            --expected-head "$CHECKED_HEAD" \
            --target-dir "$RUNNER_TEMP/web-pixel-target" \
            --output "$BENCH_DIR/output/pixel-correctness"

      - name: Preserve correctness results and build provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-pixel-correctness-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            crates/ironrdp-web/benches/dirty-region/output/pixel-correctness/report.json
            crates/ironrdp-web/benches/dirty-region/output/pixel-correctness/build-manifest.json
            crates/ironrdp-web/benches/dirty-region/output/pixel-correctness/results/*.json
          if-no-files-found: warn
          retention-days: 14
